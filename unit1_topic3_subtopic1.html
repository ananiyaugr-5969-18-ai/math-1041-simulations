<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.1 Subspace Criteria | Math 1041</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --bg: #0f172a;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
        }

        .viz-box {
            background: #020617;
            border-radius: 20px;
            padding: 1.5rem;
            margin: 2rem 0;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 400px;
            border-radius: 12px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .slider-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .is-subspace { background: #10b981; color: white; }
        .not-subspace { background: #ef4444; color: white; }

        .criteria-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .criterion {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #818cf8;">The Subspace Criteria</h1>
        <p style="text-align: center; opacity: 0.7;">A subset \( W \) is a subspace only if it contains the origin and is closed under linear combinations.</p>

        <div class="viz-box">
            <canvas id="subspaceCanvas"></canvas>
            <div style="position: absolute; top: 1rem; right: 1rem;">
                <span id="statusBadge" class="status-badge is-subspace">Valid Subspace</span>
            </div>
        </div>

        <div class="controls">
            <div class="slider-container">
                <label>Plane Offset (\( d \)):</label>
                <input type="range" id="offsetSlider" min="-100" max="100" value="0" oninput="updateViz()">
            </div>
            <p id="eqnText" style="font-size: 1.2rem;">Equation: \( x + y + z = 0 \)</p>
        </div>

        <div class="criteria-list">
            <div class="criterion" id="s1"><strong>S1: Zero Vector</strong><br>✅ Passed</div>
            <div class="criterion" id="s2"><strong>S2: Addition</strong><br>✅ Passed</div>
            <div class="criterion" id="s3"><strong>S3: Scalar Mult</strong><br>✅ Passed</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('subspaceCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('offsetSlider');
        const statusBadge = document.getElementById('statusBadge');
        const s1 = document.getElementById('s1');

        function updateViz() {
            const d = parseInt(slider.value);
            const isOrigin = d === 0;

            statusBadge.innerText = isOrigin ? "Valid Subspace" : "NOT a Subspace";
            statusBadge.className = "status-badge " + (isOrigin ? "is-subspace" : "not-subspace");
            s1.innerHTML = `<strong>S1: Zero Vector</strong><br>${isOrigin ? "✅ Passed" : "❌ Failed (0 ∉ W)"}`;
            
            document.getElementById('eqnText').innerHTML = `Equation: \( x + y + z = ${-d/10} \)`;
            MathJax.typesetPromise();
            draw(d);
        }

        function draw(d) {
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, w, h);
            
            // Draw Axis (Perspective 3D-ish)
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.moveTo(cx, 0); ctx.lineTo(cx, h); // Z
            ctx.moveTo(0, cy); ctx.lineTo(w, cy); // X
            ctx.moveTo(cx - 150, cy + 150); ctx.lineTo(cx + 150, cy - 150); // Y
            ctx.stroke();

            // Draw Plane
            ctx.fillStyle = d === 0 ? 'rgba(99, 102, 241, 0.3)' : 'rgba(244, 63, 94, 0.3)';
            ctx.strokeStyle = d === 0 ? '#818cf8' : '#f43f5e';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(cx - 100, cy - 50 + d);
            ctx.lineTo(cx + 150, cy - 100 + d);
            ctx.lineTo(cx + 100, cy + 50 + d);
            ctx.lineTo(cx - 150, cy + 100 + d);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Origin Point
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        window.addEventListener('resize', () => draw(slider.value));
        updateViz();
    </script>
</body>
</html>
